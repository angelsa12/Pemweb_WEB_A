<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab ITPLN - Pendaftaran</title>

    <!-- FILE CSS -->
    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Open Recruitment Asisten</h1>

        <nav>
            <ul>
                <li><a href="inventaris.html">Inventaris</a></li>
                <li><a href="stok.html">Stok Barang</a></li>
                <li><a href="#" class="active">Pendaftaran</a></li>
                <li><a href="akun.html">Portal Akun</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENT -->
    <main>

        <form class="reg-form">

            <fieldset>

                <legend>Data Identitas Calon Asisten</legend>

                <!-- NAMA -->
                <div class="form-group">
                    <label>Nama Lengkap:</label>
                    <input type="text" placeholder="Sesuai KTM">
                </div>

                <!-- MINAT -->
                <div class="form-group">
                    <label>Minat Laboratorium:</label>

                    <select>
                        <option>Information Retrieval</option>
                        <option>Software Engineering</option>
                        <option>Intelligent Computing</option>
                    </select>
                </div>

                <!-- BAHASA -->
                <div class="form-group">
                    <label>Bahasa Pemrograman:</label>

                    <div class="checkbox-group">
                        <label><input type="checkbox"> Python</label>
                        <label><input type="checkbox"> Java</label>
                        <label><input type="checkbox"> PHP</label>
                    </div>
                </div>

                <!-- VISI -->
                <div class="form-group">
                    <label>Visi & Misi:</label>

                    <textarea rows="5"></textarea>
                </div>

                <!-- BUTTON -->
                <button type="submit">Kirim Aplikasi</button>

            </fieldset>

        </form>

    </main>

</body>
</html>
